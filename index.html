<!doctype html>
<html lang="en">
  <head>
    <script>try{const t=localStorage.getItem('rasta.theme');const d=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';document.documentElement.style.colorScheme=d?'dark':'light'}catch{}</script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#a72b65" />
    <meta
      name="description"
      content="Your university journey, made for Pakistan. Build your profile, explore universities, plan entry tests, and tell your story with Rasta."
    />
    <title>Rasta — Find your way forward</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
